name: Release Roni's One For All

# Tag a version and this builds the zip and publishes it:
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# One zip with every Roni's addon (see RonisOneForAll/.pkgmeta). Before
# tagging, add a "## vX.Y.Z" section to RonisOneForAll/CHANGELOG.md; it becomes
# the release notes on GitHub, CurseForge and Wago.
#
# Destinations: GitHub Releases always. CurseForge and Wago only when the
# repository secrets CF_API_KEY / WAGO_API_TOKEN are set AND the toc has
# X-Curse-Project-ID / X-Wago-ID. Without them that destination is skipped.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lua syntax check
        run: |
          sudo apt-get install -y -qq lua5.1 >/dev/null
          find Ronis* -name '*.lua' -not -path '*/tools/*' -not -path '*/tests/*' -print0 | xargs -0 -n1 luac5.1 -p
          echo "Lua syntax OK"

      - name: Report which destinations are configured
        env:
          CF: ${{ secrets.CF_API_KEY }}
          WAGO: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          toc=RonisOneForAll/RonisOneForAll.toc
          check() { # name, token, toc directive
            local id; id=$(grep -m1 "^## $3:" "$toc" | cut -d: -f2- | xargs)
            if [ -n "$2" ] && [ -n "$id" ]; then echo "$1: project $id, token set"
            else echo "::warning::$1 skipped (token: $([ -n "$2" ] && echo set || echo missing), $3: ${id:-missing})"; fi
          }
          check CurseForge "$CF" X-Curse-Project-ID
          check Wago "$WAGO" X-Wago-ID

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          args: -m RonisOneForAll/.pkgmeta
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
